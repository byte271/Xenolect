name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read and validate release version
        id: release
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected="Publish Xenolect v${version}"
          release_commit_message="$(git log -1 --pretty=%B)"
          case "$release_commit_message" in
            "$expected"*) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        if: steps.release.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test wheel
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install "dist/xenolect-${{ steps.release.outputs.version }}-py3-none-any.whl"
          (
            cd "$smoke_dir"
            bin/python -c "import importlib.metadata as m; from xenolect import __version__; assert __version__ == m.version('xenolect') == '${{ steps.release.outputs.version }}'"
          )
      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "v${VERSION}" dist/*.whl dist/*.tar.gz \
            --target "$VERIFIED_SHA" \
            --title "Xenolect v${VERSION}" \
            --generate-notes
      - name: Delete merged agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' |
          while IFS= read -r branch; do
            case "$branch" in
              agent/*) ;;
              *) continue ;;
            esac
            merged_count="$(
              gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
                --state merged --limit 1 --json number --jq 'length'
            )"
            if [ "$merged_count" = "1" ]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
