name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Publish Xenolect v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read and validate release version
        id: release
        shell: bash
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected="Publish Xenolect v${version}"
          case "$RELEASE_COMMIT_MESSAGE" in
            "$expected"*) ;;
            *) echo "release commit does not match package version ${version}" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test wheel
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir"
          "$smoke_dir/bin/python" -m pip install "dist/xenolect-${{ steps.release.outputs.version }}-py3-none-any.whl"
          (
            cd "$smoke_dir"
            bin/python -c "import importlib.metadata as m; from xenolect import __version__; assert __version__ == m.version('xenolect') == '${{ steps.release.outputs.version }}'"
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "Xenolect v${VERSION}" \
            --generate-notes
