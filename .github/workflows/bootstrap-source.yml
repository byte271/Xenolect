name: Bootstrap source tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .xenolect-bootstrap/part-00.b64 \
            .xenolect-bootstrap/part-01.b64 \
            .xenolect-bootstrap/part-02.b64 \
            .xenolect-bootstrap/part-03.b64 \
            .xenolect-bootstrap/part-04.b64 \
            .xenolect-bootstrap/part-05.b64 \
            .xenolect-bootstrap/part-06.b64 \
            .xenolect-bootstrap/part-07.b64 \
            .xenolect-bootstrap/part-08.b64 \
            .xenolect-bootstrap/part-09.b64 \
            | base64 -d > /tmp/xenolect-source.zip
          echo "073f4cad8e7af0f53fd642e6cecca4041a503daefa405f6bed22c2191a51aae3  /tmp/xenolect-source.zip" | sha256sum -c -
          unzip -t /tmp/xenolect-source.zip
          unzip -o /tmp/xenolect-source.zip
          rm -rf .xenolect-bootstrap
          rm -f .github/workflows/ci.yml

      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          git diff --cached --quiet && exit 0
          git commit -m "Publish Xenolect v0.1.0 source"
          git push origin HEAD:main
