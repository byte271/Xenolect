name: Apply runtime portability hotfix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-runtime-hotfix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('xenolect/service.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _spawn_background(config_path: Path, home: Path) -> int:\n    log_dir = home / "logs"\n    log_dir.mkdir(parents=True, exist_ok=True)\n    log_path = log_dir / "service.log"\n    mode = "wb" if log_path.exists() and log_path.stat().st_size > MAX_SERVICE_LOG_BYTES else "ab"\n    log = open(log_path, mode, buffering=0)  # noqa: SIM115 - child owns inherited handle\n    command = [_pythonw_executable(), "-m", "xenolect.service", "--config", str(config_path)]\n    kwargs: dict[str, Any] = {\n        "stdin": subprocess.DEVNULL,\n        "stdout": log,\n        "stderr": log,\n        "close_fds": True,\n        "env": os.environ.copy(),\n        "cwd": str(home),\n    }\n    if os.name == "nt":\n        kwargs["creationflags"] = (\n            getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)\n            | getattr(subprocess, "DETACHED_PROCESS", 0)\n            | getattr(subprocess, "CREATE_NO_WINDOW", 0)\n        )\n    else:\n        kwargs["start_new_session"] = True\n    try:\n        proc = subprocess.Popen(command, **kwargs)  # noqa: S603 - fixed executable/module\n    finally:\n        log.close()\n    _atomic_write(service_pid_path(home), str(proc.pid) + "\\n")\n    return proc.pid\n'''
          new = '''def _spawn_background(config_path: Path, home: Path) -> int:\n    log_dir = home / "logs"\n    log_dir.mkdir(parents=True, exist_ok=True)\n    log_path = log_dir / "service.log"\n    truncate_log = log_path.exists() and log_path.stat().st_size > MAX_SERVICE_LOG_BYTES\n    command = [_pythonw_executable(), "-m", "xenolect.service", "--config", str(config_path)]\n    env = os.environ.copy()\n\n    if _platform_family() == "macos" and hasattr(os, "posix_spawn"):\n        # Avoid child-side Python setup between fork and exec on macOS.\n        log_flags = os.O_WRONLY | os.O_CREAT | (os.O_TRUNC if truncate_log else os.O_APPEND)\n        file_actions = [\n            (os.POSIX_SPAWN_OPEN, 0, os.devnull, os.O_RDONLY, 0o600),\n            (os.POSIX_SPAWN_OPEN, 1, str(log_path), log_flags, 0o600),\n            (os.POSIX_SPAWN_DUP2, 1, 2),\n        ]\n        try:\n            pid = os.posix_spawn(\n                command[0], command, env, file_actions=file_actions, setsid=True\n            )\n        except (NotImplementedError, OSError) as exc:\n            raise ServiceError(f"could not start Xenolect background service: {exc}") from exc\n        _atomic_write(service_pid_path(home), str(pid) + "\\n")\n        return pid\n\n    mode = "wb" if truncate_log else "ab"\n    log = open(log_path, mode, buffering=0)  # noqa: SIM115 - child owns inherited handle\n    kwargs: dict[str, Any] = {\n        "stdin": subprocess.DEVNULL,\n        "stdout": log,\n        "stderr": log,\n        "close_fds": True,\n        "env": env,\n        "cwd": str(home),\n    }\n    if os.name == "nt":\n        kwargs["creationflags"] = (\n            getattr(subprocess, "CREATE_NEW_PROCESS_GROUP", 0)\n            | getattr(subprocess, "DETACHED_PROCESS", 0)\n            | getattr(subprocess, "CREATE_NO_WINDOW", 0)\n        )\n    else:\n        kwargs["start_new_session"] = True\n    try:\n        proc = subprocess.Popen(command, **kwargs)  # noqa: S603 - fixed executable/module\n    finally:\n        log.close()\n    _atomic_write(service_pid_path(home), str(proc.pid) + "\\n")\n    return proc.pid\n'''
          if old not in s:
              raise SystemExit('service spawn block no longer matches expected source')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('xenolect/storage/registry.py')
          s = p.read_text(encoding='utf-8')
          old_line = '        path = self.reports_dir / f"{binding.binding_id}-{stamp}.json"'
          new_line = '        path = self.reports_dir / f"{binding.binding_id}-{stamp}-{uuid.uuid4().hex[:12]}.json"'
          if old_line not in s:
              raise SystemExit('report filename line no longer matches expected source')
          p.write_text(s.replace(old_line, new_line), encoding='utf-8')
          PY
      - name: Validate focused regressions
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_service.py tests/test_service_e2e.py tests/test_install_registry.py
          python -m compileall -q xenolect
      - name: Commit hotfix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-runtime-hotfix.yml
          git config user.name "Byte271"
          git config user.email "yihac1@outlook.com"
          git add xenolect/service.py xenolect/storage/registry.py .github/workflows/apply-runtime-hotfix.yml
          git commit -m "Fix macOS service spawn and report collisions"
          git push origin HEAD:main
