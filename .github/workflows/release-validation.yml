name: v0.1.0 release validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-validation.yml"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for release source if publisher is still finishing
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            git fetch origin main
            git reset --hard origin/main
            if [ -f pyproject.toml ] && [ -f xenolect/cli/main.py ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Compileall
        run: python -m compileall -q xenolect

  cleanup:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary validation commit when safe
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          trigger='${{ github.sha }}'
          if [ "$current" != "$trigger" ]; then
            echo 'main already advanced/rewritten; nothing to clean'
            exit 0
          fi
          parent="$(git rev-parse "$trigger^")"
          git checkout --detach "$parent"
          test -f pyproject.toml
          test -f xenolect/cli/main.py
          test ! -d .xenolect-bootstrap
          git push --force origin "$parent:refs/heads/main"
