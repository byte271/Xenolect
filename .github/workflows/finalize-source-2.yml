name: Finalize source history 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-source-2.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and clean
        shell: bash
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f xenolect/cli/main.py
          test -f xenolect/xpt/compiled/diagnostic_program.json
          test -f .github/workflows/ci.yml
          test ! -d .xenolect-bootstrap
          grep -q 'version = "0.1.0"' pyproject.toml
          rm -f .github/workflows/finalize-source.yml
          rm -f .github/workflows/finalize-source-2.yml
          rm -f .github/workflows/source-transfer.yml
          rm -f .github/workflows/source-transfer-retry.yml
          rm -f .github/workflows/bootstrap-source.yml
          rm -rf .xenolect-bootstrap
          git add -A
          tree="$(git write-tree)"
          parent='9d30f183ff6b00a5a66def93af8103c38ee22f8e'
          new_commit="$(printf '%s\n' 'Publish Xenolect v0.1.0' | git commit-tree "$tree" -p "$parent")"
          git push --force origin "$new_commit:refs/heads/main"
          echo "$new_commit"
