name: Publish Xenolect v0.1.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v010.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact release source
        shell: bash
        run: |
          set -euo pipefail
          expected='073f4cad8e7af0f53fd642e6cecca4041a503daefa405f6bed22c2191a51aae3'
          ok=0
          for i in $(seq 1 60); do
            rm -f /tmp/xenolect-source.zip
            if curl --silent --show-error --fail --location \
              -H 'bypass-tunnel-reminder: true' \
              -o /tmp/xenolect-source.zip \
              'https://xenolect-byte271-v010.loca.lt/xenolect-0.1.0-source.zip'; then
              actual="$(sha256sum /tmp/xenolect-source.zip | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ok=1
                break
              fi
              echo "attempt $i: SHA mismatch ($actual)"
            else
              echo "attempt $i: download failed"
            fi
            sleep 10
          done
          test "$ok" = 1
          unzip -t /tmp/xenolect-source.zip

      - name: Build clean release commit
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -o /tmp/xenolect-source.zip
          test -f pyproject.toml
          test -f README.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f xenolect/cli/main.py
          test -f xenolect/xpt/compiled/diagnostic_program.json
          test -f .github/workflows/ci.yml
          grep -q 'version = "0.1.0"' pyproject.toml
          git add -A
          tree="$(git write-tree)"
          parent='9d30f183ff6b00a5a66def93af8103c38ee22f8e'
          new_commit="$(printf '%s\n' 'Publish Xenolect v0.1.0' | git commit-tree "$tree" -p "$parent")"
          git push --force origin "$new_commit:refs/heads/main"
          echo "FINAL_COMMIT=$new_commit"
