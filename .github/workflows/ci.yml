name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m ruff check
          xenolect/compiler/install.py
          xenolect/compiler/xpt_real.py
          xenolect/xpt/diagnostic_probe.py
          xenolect/xpt/ablation.py
          xenolect/xpt/discrimination.py
          xenolect/xpt/hypothesis.py
          xenolect/xpt/runtime.py
          xenolect/xpt/session.py
          tests/test_diagnostic_probe.py
          tests/test_oracle_free_protocol_synthesis.py
      - run: python -m pytest -q
      - run: python -m compileall -q xenolect
