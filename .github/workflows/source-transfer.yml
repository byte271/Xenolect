name: Source transfer

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-transfer.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Xenolect source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -H 'bypass-tunnel-reminder: true' \
            -o /tmp/xenolect-source.zip \
            'https://xenolect-byte271-v010.loca.lt/xenolect-0.1.0-source.zip'
          echo '073f4cad8e7af0f53fd642e6cecca4041a503daefa405f6bed22c2191a51aae3  /tmp/xenolect-source.zip' | sha256sum -c -
          unzip -t /tmp/xenolect-source.zip

      - name: Replace temporary tree with release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .xenolect-bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/source-transfer.yml
          unzip -o /tmp/xenolect-source.zip

      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Xenolect v0.1.0 source'
          git push origin HEAD:main
