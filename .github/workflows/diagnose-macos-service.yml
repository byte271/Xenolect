name: Diagnose macOS service startup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-macos-service.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - name: Spawn and inspect child
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          import tempfile, time
          from xenolect.driver.ir import identity_driver
          from xenolect.service import ServiceConfig, save_service_config, _spawn_background, _health_payload
          from xenolect.storage.registry import DriverRegistry

          home = Path(tempfile.mkdtemp(prefix='xenolect-mac-diag-'))
          DriverRegistry(home).install(
              base_url='http://127.0.0.1:65530/v1',
              model='diag-model',
              driver=identity_driver(),
          )
          cfg = ServiceConfig(host='127.0.0.1', port=19179)
          cfg_path = save_service_config(cfg, home)
          pid = _spawn_background(cfg_path, home)
          print(f'DIAG_HOME={home}', flush=True)
          print(f'DIAG_PID={pid}', flush=True)
          for i in range(20):
              payload = _health_payload(cfg, timeout=0.2)
              print(f'health[{i}]={payload}', flush=True)
              if payload:
                  break
              time.sleep(0.25)
          Path('/tmp/xenolect-diag-pid').write_text(str(pid))
          Path('/tmp/xenolect-diag-home').write_text(str(home))
          PY
          PID="$(cat /tmp/xenolect-diag-pid)"
          HOME_DIR="$(cat /tmp/xenolect-diag-home)"
          echo "=== ps ==="
          ps -p "$PID" -o pid,ppid,state,etime,command || true
          echo "=== lsof process ==="
          lsof -p "$PID" || true
          echo "=== lsof port ==="
          lsof -nP -iTCP:19179 || true
          echo "=== service log ==="
          cat "$HOME_DIR/logs/service.log" || true
          echo "=== sample ==="
          sample "$PID" 2 1 || true
          kill "$PID" || true
