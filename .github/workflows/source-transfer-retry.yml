name: Source transfer retry

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/source-transfer-retry.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact release source
        shell: bash
        run: |
          set -euo pipefail
          expected='073f4cad8e7af0f53fd642e6cecca4041a503daefa405f6bed22c2191a51aae3'
          ok=0
          for i in $(seq 1 60); do
            rm -f /tmp/xenolect-source.zip
            if curl --silent --show-error --fail --location \
              -H 'bypass-tunnel-reminder: true' \
              -o /tmp/xenolect-source.zip \
              'https://xenolect-byte271-v010.loca.lt/xenolect-0.1.0-source.zip'; then
              actual="$(sha256sum /tmp/xenolect-source.zip | awk '{print $1}')"
              if [ "$actual" = "$expected" ]; then
                ok=1
                break
              fi
              echo "attempt $i: SHA mismatch ($actual)"
            else
              echo "attempt $i: download failed"
            fi
            sleep 10
          done
          test "$ok" = 1
          unzip -t /tmp/xenolect-source.zip

      - name: Publish release source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .xenolect-bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rm -f .github/workflows/source-transfer.yml
          rm -f .github/workflows/source-transfer-retry.yml
          unzip -o /tmp/xenolect-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Xenolect v0.1.0 source'
          git push origin HEAD:main
